<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teste de formatos</title>
<style>body{font:16px -apple-system,Arial;padding:18px;max-width:560px;margin:auto}
button{display:block;width:100%;margin:12px 0 2px;padding:14px;font-size:16px;border-radius:10px;border:1px solid #888;background:#f3f3f3;text-align:left}
small{display:block;color:#555;word-break:break-all}.r{color:#070;margin-bottom:4px}</style></head><body>
<h3>Teste de formatos (POST) do Inject</h3>
<p>Toque em <b>um botão de cada vez</b> e veja qual notificação chega com o texto <b>TESTE-n</b>. Depois me diga o número que funcionou (e o que apareceu em verde abaixo do botão).</p>
<div id="l"></div>
<script>
var A="https://11z.co/_w/17794/selection", B="https://11z.co/_w/17794_selection";
var J="application/json", F="application/x-www-form-urlencoded", T="text/plain;charset=UTF-8";
var tests=[
 [A,J,'{"value":"TESTE-1"}'],
 [B,J,'{"value":"TESTE-2"}'],
 [A,F,'value=TESTE-3'],
 [B,F,'value=TESTE-4'],
 [A,T,'TESTE-5'],
 [B,T,'TESTE-6']
];
var l=document.getElementById("l");
function add(label,desc,fn){
  var b=document.createElement("button"),s=document.createElement("small"),r=document.createElement("small");
  b.textContent=label; s.textContent=desc; r.className="r";
  b.onclick=function(){ r.textContent="..."; fn(r); };
  l.appendChild(b); l.appendChild(s); l.appendChild(r);
}
tests.forEach(function(x,i){
  add("Enviar formato "+(i+1), "POST "+x[0]+"  |  "+x[1].split(";")[0]+"  |  "+x[2], function(out){
    var opt={method:"POST",cache:"no-store",headers:{"Content-Type":x[1]},body:x[2]};
    if(x[1]===J){
      fetch(x[0],opt).then(function(r){return r.text().then(function(t){out.textContent="Resposta "+r.status+": "+t.slice(0,200);});})
      .catch(function(){ // sem permissão (CORS): reenvia como text/plain
        fetch(x[0],{method:"POST",mode:"no-cors",cache:"no-store",headers:{"Content-Type":T},body:x[2]})
        .then(function(){out.textContent="Enviado como texto (sem resposta legível)";},function(){out.textContent="Falhou (internet?)";});
      });
    } else {
      opt.mode="no-cors";
      fetch(x[0],opt).then(function(){out.textContent="Enviado (sem resposta legível)";},function(){out.textContent="Falhou (internet?)";});
    }
  });
});
add("Ler o que está no Inject (GET)", "GET "+A+"?rc=-1", function(out){
  fetch(A+"?rc=-1",{cache:"no-store"}).then(function(r){return r.text();})
  .then(function(t){out.textContent="Resposta: "+t.slice(0,300);},function(){out.textContent="O navegador não deixa ler a resposta (normal).";});
});
</script></body></html>
