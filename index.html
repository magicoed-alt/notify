<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<title>Notas</title>
<style>
  :root{
    --bg:#ffffff;
    --fg:#000000;
    --ctl:#ffffff;
    --bd:rgba(0,0,0,.09);
    --sh:0 4px 14px rgba(0,0,0,.10);
    --accent:#DDB139;
    --kb:rgba(255,255,255,.92);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000;
      --fg:#ffffff;
      --ctl:#1f1f20;
      --bd:rgba(255,255,255,.10);
      --sh:0 4px 14px rgba(0,0,0,.55);
      --accent:#E3B63D;
      --kb:rgba(31,31,32,.94);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    -webkit-text-size-adjust:100%;overscroll-behavior:none}
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:default}

  #app{position:fixed;left:0;right:0;top:0;height:100%;display:flex;flex-direction:column;background:var(--bg)}

  /* ---------- barra superior ---------- */
  header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 18px 6px;flex:none}
  header .grow{flex:1}
  .circle,.pill{background:var(--ctl);border:.5px solid var(--bd);box-shadow:var(--sh);
    display:flex;align-items:center;justify-content:center;color:var(--fg)}
  .circle{width:42px;height:42px;border-radius:50%}
  .pill{height:42px;border-radius:21px;padding:0 6px}
  .pill button{width:50px;height:42px;display:flex;align-items:center;justify-content:center}
  .circle.done{background:var(--accent);border-color:transparent;color:#fff}
  svg{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  svg .fill{fill:currentColor;stroke:none}

  body:not(.editing) .done{display:none}
  body.editing #undo{opacity:1}
  body:not(.editing) #undo{opacity:.35}

  /* ---------- nota ---------- */
  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 26px 24px;display:flex;flex-direction:column}
  textarea{display:block;flex:none;font-family:inherit;width:100%;border:0;outline:0;resize:none;overflow:hidden;background:transparent;
    color:var(--fg);caret-color:var(--accent);padding:0;margin:0;border-radius:0;-webkit-appearance:none;appearance:none}
  textarea::selection{background:rgba(221,177,57,.35)}
  #title{font-size:28px;font-weight:700;line-height:1.2;letter-spacing:-.2px;min-height:34px}
  #body{font-size:17px;line-height:1.35;margin-top:10px;min-height:60vh}

  /* ---------- barra de formatação (acima do teclado) ---------- */
  #fmt{position:absolute;left:10px;right:10px;bottom:8px;height:54px;border-radius:27px;display:none;
    background:var(--kb);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    border:.5px solid var(--bd);box-shadow:var(--sh);align-items:center;justify-content:space-around;padding:0 10px}
  body.editing.kb #fmt{display:flex}
  #fmt button{height:44px;min-width:44px;display:flex;align-items:center;justify-content:center}
  #fmt .aa{font-size:25px;font-weight:500;letter-spacing:-.5px}
  #fmt svg{width:26px;height:26px}

  /* ---------- barra inferior (modo leitura) ---------- */
  #viewbar{position:absolute;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:space-between;
    padding:0 22px calc(env(safe-area-inset-bottom) + 14px)}
  body:not(.editing) #viewbar{display:flex}
  #viewbar .pill{height:52px;border-radius:26px;padding:0 10px}
  #viewbar .pill button{width:62px;height:52px}
  #viewbar .circle{width:52px;height:52px}
  #viewbar svg{width:25px;height:25px}

  /* toast só para testes (#teste na URL) */
  #dbg{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 62px);background:#111;color:#8f8;
    font:12px/1.35 ui-monospace,Menlo,monospace;padding:8px 10px;border-radius:10px;display:none;z-index:9;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body class="editing">
<div id="app">

  <header>
    <button class="circle" id="back" aria-label="Voltar">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="grow"></div>
    <button class="circle" id="undo" aria-label="Desfazer">
      <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg>
    </button>
    <div class="pill">
      <button aria-label="Compartilhar"><svg viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M8 7l4-4 4 4"/><path d="M7 10H6a1 1 0 00-1 1v9a1 1 0 001 1h12a1 1 0 001-1v-9a1 1 0 00-1-1h-1"/></svg></button>
      <button aria-label="Mais"><svg viewBox="0 0 24 24"><circle class="fill" cx="5" cy="12" r="1.9"/><circle class="fill" cx="12" cy="12" r="1.9"/><circle class="fill" cx="19" cy="12" r="1.9"/></svg></button>
    </div>
    <button class="circle done" id="done" aria-label="Concluído">
      <svg viewBox="0 0 24 24" style="stroke-width:2.6"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </button>
  </header>

  <main id="main">
    <textarea id="title" rows="1" autocomplete="off" aria-label="Título"></textarea>
    <textarea id="body" rows="1" autocomplete="off" aria-label="Nota"></textarea>
  </main>

  <!-- barra acima do teclado -->
  <div id="fmt">
    <button class="aa" aria-label="Formato">Aa</button>
    <button aria-label="Lista de verificação">
      <svg viewBox="0 0 24 24"><circle class="fill" cx="6" cy="7" r="3.4"/><path d="M4.4 7l1.2 1.2 2-2.4" style="stroke:var(--kb);stroke-width:1.6"/><circle cx="6" cy="17" r="3.2"/><path d="M12 7h9M12 17h9"/></svg>
    </button>
    <button aria-label="Tabela">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 10h18M3 14.5h18M9 5v14M15 5v14"/></svg>
    </button>
    <button aria-label="Anexo">
      <svg viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 01-7.8-7.8l8.9-8.9a3.7 3.7 0 015.2 5.2l-8.9 8.9a1.8 1.8 0 01-2.6-2.6l8.2-8.2"/></svg>
    </button>
    <button aria-label="Marcação">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6.2l3.8 10.6M12 6.2L8.2 16.8M9.6 13.6h4.8"/></svg>
    </button>
  </div>

  <!-- barra inferior quando não está digitando -->
  <div id="viewbar">
    <div class="pill">
      <button aria-label="Lista de verificação">
        <svg viewBox="0 0 24 24"><circle class="fill" cx="6" cy="7" r="3.4"/><path d="M4.4 7l1.2 1.2 2-2.4" style="stroke:var(--ctl);stroke-width:1.6"/><circle cx="6" cy="17" r="3.2"/><path d="M12 7h9M12 17h9"/></svg>
      </button>
      <button aria-label="Anexo">
        <svg viewBox="0 0 24 24"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 01-7.8-7.8l8.9-8.9a3.7 3.7 0 015.2 5.2l-8.9 8.9a1.8 1.8 0 01-2.6-2.6l8.2-8.2"/></svg>
      </button>
      <button aria-label="Marcação">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6.2l3.8 10.6M12 6.2L8.2 16.8M9.6 13.6h4.8"/></svg>
      </button>
    </div>
    <button class="circle" id="compose" aria-label="Nova nota">
      <svg viewBox="0 0 24 24"><path d="M12 4H6.5A2.5 2.5 0 004 6.5v11A2.5 2.5 0 006.5 20h11a2.5 2.5 0 002.5-2.5V12"/><path d="M18.4 2.8a2.1 2.1 0 013 3L12 15.2l-4 1 1-4z"/></svg>
    </button>
  </div>

  <div id="dbg"></div>
</div>

<script>
(function(){
  "use strict";

  /* =====================================================================
     CONFIGURAÇÃO — é só aqui que você mexe
     ===================================================================== */
  var CONFIG = {
    // Endereço do seu Inject
    url: "https://11z.co/_w/17794/selection",

    // "POST" (enviar para o Inject) ou "GET" (se usar GET, coloque {texto} na url)
    metodo: "POST",

    // Corpo do POST. Marcadores:
    //   {texto}     = texto puro            -> "{texto}"
    //   {textoUrl}  = texto codificado      -> "selection={textoUrl}"
    //   {textoJson} = texto como string JSON -> '{"selection":{textoJson}}'
    corpo: '{"value":{textoJson}}',

    // Tipo do corpo. Se o navegador não permitir application/json (CORS),
    // o envio é refeito automaticamente como text/plain com o mesmo conteúdo.
    tipo: "application/json",

    // Segundos sem digitar até enviar
    espera: 5,

    // true = envia só uma vez (a primeira vez que a pessoa para por 5s).
    // false = a cada pausa de 5s com texto novo, envia o texto completo de novo.
    enviarSoUmaVez: false,

    // Tentativas extras se a internet falhar
    novasTentativas: 3
  };
  /* ===================================================================== */

  var $ = function(id){ return document.getElementById(id); };
  var app = $("app"), titleEl = $("title"), bodyEl = $("body"), main = $("main"), dbg = $("dbg");
  var editing = true, timer = null, lastSent = "", sentOnce = false, retries = 0;
  var testMode = /teste/i.test(location.hash);

  /* ---------- tamanho da área visível (acompanha o teclado) ---------- */
  function layout(){
    var vv = window.visualViewport;
    var h = vv ? vv.height : window.innerHeight;
    var top = vv ? vv.offsetTop : 0;
    app.style.height = h + "px";
    app.style.transform = "translateY(" + top + "px)";
    var kb = Math.max(0, window.innerHeight - h - top);
    document.body.classList.toggle("kb", kb > 100);
    if (window.scrollY) window.scrollTo(0, 0);
  }
  if (window.visualViewport){
    visualViewport.addEventListener("resize", layout);
    visualViewport.addEventListener("scroll", layout);
  }
  window.addEventListener("resize", layout);
  layout();

  /* ---------- campos que crescem ---------- */
  function grow(el){ el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; }
  function growAll(){ grow(titleEl); grow(bodyEl); }

  /* ---------- modo escrever / modo ler ---------- */
  function setEditing(on){
    editing = on;
    document.body.classList.toggle("editing", on);
    titleEl.readOnly = bodyEl.readOnly = !on;
    if (!on){ titleEl.blur(); bodyEl.blur(); }
    setTimeout(layout, 50);
  }
  function end(el){ var n = el.value.length; try{ el.setSelectionRange(n, n); }catch(e){} }

  $("done").addEventListener("click", function(){ setEditing(false); });
  $("compose").addEventListener("click", function(){ setEditing(true); bodyEl.focus(); end(bodyEl); });
  main.addEventListener("click", function(e){
    if (editing) return;
    setEditing(true);
    var el = (e.target === titleEl) ? titleEl : bodyEl;
    el.focus(); end(el);
  });
  // toque na área vazia durante a digitação leva o cursor pro fim da nota
  main.addEventListener("click", function(e){
    if (!editing) return;
    if (e.target === titleEl || e.target === bodyEl) return;
    bodyEl.focus(); end(bodyEl);
  });

  /* ---------- título -> corpo, como no app Notas ---------- */
  titleEl.addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.isComposing){
      e.preventDefault();
      bodyEl.focus();
      bodyEl.setSelectionRange(0, 0);
    }
  });
  bodyEl.addEventListener("keydown", function(e){
    if (e.key === "Backspace" && bodyEl.selectionStart === 0 && bodyEl.selectionEnd === 0){
      e.preventDefault();
      titleEl.focus(); end(titleEl);
    }
  });
  // colar quebra de linha no título vai para o corpo
  titleEl.addEventListener("input", function(){
    if (/\n/.test(titleEl.value)){
      var p = titleEl.value.split("\n");
      titleEl.value = p.shift();
      bodyEl.value = p.join("\n") + bodyEl.value;
      bodyEl.focus(); bodyEl.setSelectionRange(0, 0);
      growAll();
    }
  });

  /* ---------- envio para o Inject ---------- */
  function currentText(){
    var t = titleEl.value.replace(/\s+$/, "");
    var b = bodyEl.value;
    return (t + (b.trim() ? "\n" + b : "")).trim();
  }

  function log(msg){
    if (!testMode) return;
    dbg.style.display = "block";
    dbg.textContent = msg;
  }

  function montar(text){
    var url = CONFIG.url.split("{texto}").join(encodeURIComponent(text));
    var opts = {mode:"no-cors", cache:"no-store", keepalive:true, referrerPolicy:"no-referrer", method:CONFIG.metodo};
    if (CONFIG.metodo !== "GET"){
      opts.headers = {"Content-Type": CONFIG.tipo};
      opts.body = CONFIG.corpo.split("{textoJson}").join(JSON.stringify(text))
                              .split("{textoUrl}").join(encodeURIComponent(text))
                              .split("{texto}").join(text);
    }
    return {url:url, opts:opts};
  }

  function send(text){
    var r = montar(text);
    log("ENVIANDO " + CONFIG.metodo + ":\n" + r.url + (r.opts.body !== undefined ? "\n" + r.opts.body : ""));
    var ok = function(){ retries = 0; log("ENVIADO " + CONFIG.metodo + ":\n" + r.url + (r.opts.body !== undefined ? "\n" + r.opts.body : "")); };
    var fail = function(){
      if (retries < CONFIG.novasTentativas){
        retries++; lastSent = "";         // permite reenviar
        clearTimeout(timer);
        timer = setTimeout(flush, CONFIG.espera * 1000);
      }
    };
    try{
      if (CONFIG.metodo !== "GET" && CONFIG.tipo.indexOf("json") > -1){
        // 1ª tentativa normal (JSON). Se o navegador barrar (CORS), reenvia como text/plain.
        var alt = {mode:"no-cors", cache:"no-store", keepalive:true, referrerPolicy:"no-referrer", method:"POST",
                   headers:{"Content-Type":"text/plain;charset=UTF-8"}, body:r.opts.body};
        var o2 = {cache:"no-store", keepalive:true, referrerPolicy:"no-referrer", method:"POST",
                  headers:{"Content-Type":CONFIG.tipo}, body:r.opts.body};
        fetch(r.url, o2).then(ok, function(){ fetch(r.url, alt).then(ok, fail); });
      } else {
        fetch(r.url, r.opts).then(ok, fail);
      }
    }catch(e){ fail(); }
  }

  function flush(){
    clearTimeout(timer); timer = null;
    if (CONFIG.enviarSoUmaVez && sentOnce) return;
    var text = currentText();
    if (!text || text === lastSent) return;
    lastSent = text; sentOnce = true;
    send(text);
  }

  function onType(e){
    if (e && e.target) grow(e.target);
    clearTimeout(timer);
    timer = setTimeout(flush, CONFIG.espera * 1000);
  }
  titleEl.addEventListener("input", onType);
  bodyEl.addEventListener("input", onType);

  // Se a pessoa sair do navegador antes dos 5s, o iPhone congela o timer.
  // Então manda na hora o que estiver pendente, para não perder o texto.
  document.addEventListener("visibilitychange", function(){
    if (document.visibilityState === "hidden" && timer) flush();
  });
  window.addEventListener("pagehide", function(){ if (timer) flush(); });

  /* ---------- início ---------- */
  setEditing(true);
  growAll();
  titleEl.focus();
  // o iPhone só abre o teclado depois de um toque; o primeiro toque em qualquer lugar foca o título
  document.addEventListener("touchend", function first(){
    document.removeEventListener("touchend", first);
    if (editing && document.activeElement !== titleEl && document.activeElement !== bodyEl) titleEl.focus();
  }, {passive:true});
})();
</script>
</body>
</html>
